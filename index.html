<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- スマホの画面幅にピタッと合わせる＆iPhoneの上の時計表示などのエリアも綺麗に使う設定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ぼくの初めてのスマホアプリ</title>
    <style>
        /* iPhoneの画面いっぱいにレイアウトを広げる基本ルール */
        body {
            margin: 0;
            padding: 20px;
            /* iPhoneの画面の高さぴったりにする（svhを使うとズレにくいよ） */
            height: 100svh;
            background-color: #f0f8ff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        /* アプリのボタンのデザイン */
        button {
            font-size: 20px;
            padding: 15px 30px;
            background-color: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50px; /* 角を丸くしてスマホっぽくする */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            cursor: pointer;
        }

        /* 結果を表示する文字 */
        #message {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <h1>スマホアプリ</h1>
    <button id="actionButton">おしてね！</button>
    <div id="message">ボタンを押してね</div>

    <script>
        // ここにJavaScriptのプログラムを書くよ！
        const button = document.getElementById('actionButton');
        const message = document.getElementById('message');

        // ボタンが押されたとき（タップされたとき）の動き
        button.addEventListener('click', function() {
            message.textContent = "やったね！アプリが動いたよ！🎉";
        });
    </script>

</body>
</html>
